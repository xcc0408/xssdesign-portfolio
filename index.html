body {

.brand-qr-popover {
  position: absolute;

  width: 198px;
  padding: 10px 10px 12px;
  border: 1px solid rgb(255 255 255 / 70%);

  transform: translateY(-8px) scale(.96);
  transform-origin: top left;

  transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
}

.brand-qr-popover::before {
  content: '';

  top: -6px;

  height: 12px;

}

.site-brand:hover .brand-qr-popover,
.site-brand:focus-visible .brand-qr-popover,
.site-brand:focus-within .brand-qr-popover {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
  transition-delay: 0s;
}

@property --contact-orbit {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}

.contact-button {
  position: relative;
  display: grid;
  place-items: center;
  width: 92px;
  height: 32px;
  border: 1px solid rgb(255 255 255 / 40%);
  border-radius: 30px;
  color: #fff;
  text-decoration: none;
  isolation: isolate;
}

.contact-button span {
  opacity: 0.7;
  transition: opacity 160ms ease;
}

.contact-button::before {
  content: '';
  position: absolute;
  inset: -1px;
  padding: 1px;
  border-radius: inherit;
  background: conic-gradient(from var(--contact-orbit),
    transparent 0deg 240deg, rgb(255 255 255 / 18%) 280deg,
    #fff 315deg, rgb(255 255 255 / 18%) 340deg, transparent 360deg);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  opacity: 0;
  pointer-events: none;
  animation: contact-orbit 2.4s linear infinite paused;
  transition: opacity 160ms ease;
}

.contact-button:is(:hover, :focus-visible) span {
  opacity: 1;
}

.contact-button:is(:hover, :focus-visible)::before {
  opacity: 1;
  animation-play-state: running;
}

.contact-button:focus-visible,
.site-brand:focus-visible,
.contact-link:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}

@keyframes contact-orbit {
  to { --contact-orbit: 360deg; }
}

.page-background {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

.background-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition: opacity 900ms cubic-bezier(0.22, 1, 0.36, 1),
    visibility 0s linear 900ms;
}

.background-layer.is-active {
  opacity: 1;
  visibility: visible;
  transition-delay: 0s, 0s;
}

.background-layer.default-background::after {
  content: none;
}

.default-background { background: #0d0d0d; }

.default-background-media {
  position: absolute;
  inset: 0 20px auto;
}

.default-background-media img {
  display: block;
  width: 100%;
  height: auto;
}

/* The wide blur is baked into tiny WebP files before browser rendering. */
.background-cover {
  position: absolute;
  inset: -3%;
  width: 106%;
  height: 106%;
  object-fit: cover;
  pointer-events: none;
}

.background-tint {
  position: absolute;
  inset: 0;
  opacity: 0.5;
  pointer-events: none;
}

.background-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 12%,
    rgb(0 0 0 / 24%), rgb(0 0 0 / 0%) 72%);

.background-layer[data-foreground='dark']::after {

}

  to { background-position: -80% 0; }
}

  const PROJECT_ICONS = window.__PORTFOLIO__.icons;
  const PROJECTS = window.__PORTFOLIO__.projects.map(p => ({...p,
    logo: PROJECT_ICONS[p.icon] || PROJECT_ICONS.sparkles,
    displayImage: p.details[0]?.src, displayWidth: p.details[0]?.width,
    displayHeight: p.details[0]?.height, displayAlt: p.details[0]?.alt || p.title + ' 项目展示'}));
  const DEFAULT_PROJECT = { background: '#0d0d0d', logo: PROJECT_ICONS.sparkles,
    title: window.__PORTFOLIO__.site.mainTitle, titleLines: [window.__PORTFOLIO__.site.mainTitle], introduction: '' };
  // Mutable interaction state: idle → opening → open → closing → idle.
  const CARD_COUNT = PROJECTS.length;
  const presentationLayers = new Map([[null, headerContent]]);
  const backgroundLayers = new Map();
  const EMPTY_TARGETS = new Map();
  const items = [];
  let layout;
  let phase = 0;
  let pointerTarget = 0;
  let pointerAngle = 0;
  let pointerX = null;
  let pointerY = null;
  let hovered = null;
  let hoverActive = false;
  let selected = null;
  let mode = 'idle';
  let progress = 0;
  let direction = 0;
  let backgroundResetTimer = null;
  let stackOffsets = [];
  let stackLayout = null;
  let presentationIndex = null;
  let presentationTween = null;
  let presentationPending = false;
  let pendingPresentationIndex = null;
  let lastModalAmount = null;
  let modalNeedsRender = true;
  let modalScrollStart = 0;
  let lastTime = performance.now();
  let frameRequest = null;
  let layoutDirty = false;
  const SETTLE_EPSILON = 0.0001;

  const clamp = value => Math.max(0, Math.min(1, value));
  const mix = (from, to, amount) => from + (to - from) * amount;
  const ease = value => value < 0.5 ? 4 * value ** 3 : 1 - (-2 * value + 2) ** 3 / 2;
  const wrap = (angle, span) => ((angle + span / 2) % span + span) % span - span / 2;

  // Snap asymptotic interpolation to its target so a settled scene can sleep.
  const approach = (value, target, amount) => {
    const next = mix(value, target, amount);
    return Math.abs(next - target) < SETTLE_EPSILON ? target : next;
  };

  function requestRender() {
    if (frameRequest !== null || document.hidden) return;
    lastTime = performance.now();
    frameRequest = requestAnimationFrame(frame);

  function invalidateLayout() {
    layoutDirty = true;
    requestRender();

  function needsNextFrame() {
    if (layoutDirty || presentationPending) return true;
    if (mode !== 'idle') return direction !== 0 || modalNeedsRender;
    if (!reducedMotion.matches && !hoverActive && AUTO_SPEED !== 0) return true;
    if (pointerAngle !== pointerTarget) return true;
    return items.some(item => {
      const targetAmount = hoverActive && item === hovered ? 1 : 0;
      const targetPush = hoverActive && item !== hovered
        ? Math.sign(item.angle - hovered.angle) * layout.hoverPush : 0;
      return item.hoverAmount !== targetAmount || item.anglePush !== targetPush;
    });
  }

  // Render spatially varying blur from the current image, never from a baked bitmap.
  // Adjacent Gaussian levels crossfade in narrow bands between 50% and 85% height.
  function bindAvatarBlur(portrait) {
    const image = portrait.querySelector('.avatar');
    const output = portrait.querySelector('.avatar-render');
    const source = document.createElement('canvas');
    const band = document.createElement('canvas');
    const context = output.getContext('2d');
    const sourceContext = source.getContext('2d');
    const bandContext = band.getContext('2d');
    if (!context || !sourceContext || !bandContext) return;
    let lastRender = '';
    function render() {
      if (!image.complete || !image.naturalWidth || !portrait.isConnected) return;
      const width = portrait.clientWidth;
      const height = portrait.clientHeight;
      if (!width || !height) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const start = Number(portrait.dataset.blurStart);
      const end = Number(portrait.dataset.blurEnd);
      const radius = Number(portrait.dataset.blurMax);
      const padding = radius;
      const key = [image.currentSrc || image.src, width, height, dpr, start, end, radius].join('|');
      if (key === lastRender) return;
      const renderWidth = Math.ceil((width + padding * 2) * dpr);
      const renderHeight = Math.ceil((height + padding * 2) * dpr);
      for (const canvas of [output, source, band]) {
        canvas.width = renderWidth;
        canvas.height = renderHeight;
      }
      Object.assign(output.style, {
        left: `${-padding}px`, top: `${-padding}px`,
        width: `${width + padding * 2}px`, height: `${height + padding * 2}px`,
      });
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const cropWidth = width / scale;
      const cropHeight = height / scale;
      sourceContext.drawImage(image,
        (image.naturalWidth - cropWidth) / 2, (image.naturalHeight - cropHeight) / 2,
        cropWidth, cropHeight, padding * dpr, padding * dpr, width * dpr, height * dpr);
      const levels = 14;
      const step = (end - start) / levels;
      const y = fraction => (padding + fraction * height) * dpr / renderHeight;
      context.globalCompositeOperation = 'lighter';
      for (let level = 0; level <= levels; level += 1) {
        bandContext.clearRect(0, 0, renderWidth, renderHeight);
        bandContext.globalCompositeOperation = 'source-over';
        bandContext.filter = level ? `blur(${radius * level / levels * dpr}px)` : 'none';
        bandContext.drawImage(source, 0, 0);
        bandContext.filter = 'none';
        const mask = bandContext.createLinearGradient(0, 0, 0, renderHeight);
        if (level === 0) {
          mask.addColorStop(0, '#fff');
          mask.addColorStop(y(start), '#fff');
          mask.addColorStop(y(start + step), 'transparent');
          mask.addColorStop(1, 'transparent');
        } else if (level === levels) {
          mask.addColorStop(0, 'transparent');
          mask.addColorStop(y(end - step), 'transparent');
          mask.addColorStop(y(end), '#fff');
          mask.addColorStop(1, '#fff');
        } else {
          const center = start + step * level;
          mask.addColorStop(0, 'transparent');
          mask.addColorStop(y(center - step), 'transparent');
          mask.addColorStop(y(center), '#fff');
          mask.addColorStop(y(center + step), 'transparent');
          mask.addColorStop(1, 'transparent');
        }
        bandContext.globalCompositeOperation = 'destination-in';
        bandContext.fillStyle = mask;
        bandContext.fillRect(0, 0, renderWidth, renderHeight);
        context.drawImage(band, 0, 0);
      }
      context.globalCompositeOperation = 'source-over';
      lastRender = key;
      portrait.classList.add('is-rendered');
    }
    image.addEventListener('load', render);
    image.addEventListener('error', () => portrait.classList.remove('is-rendered'));
    new ResizeObserver(render).observe(portrait);
    render();
  }

  // Header/background presentation, independent from the gallery geometry.
  function buildPresentationLayers() {
    logoPath.setAttribute('d', DEFAULT_PROJECT.logo);
    titleText.innerHTML = DEFAULT_PROJECT.titleLines.map(line => `<span>${escapeHTML(line)}</span>`).join('');
    backgroundLayers.set(null, document.querySelector('.default-background'));
    PROJECTS.forEach((project, index) => {
      const content = headerContent.cloneNode(true);
      content.classList.remove('is-active', 'is-default');
      content.classList.add('is-project');
      content.querySelector('.default-identity-position').className = 'project-identity-position';
      const identity = content.querySelector('.identity-face');
      identity.className = 'identity-face project-identity';
      identity.querySelector('.avatar-portrait').remove();
      identity.querySelectorAll('[data-default-only]').forEach(node => node.remove());
      const iconSpace = document.createElement('span');
      iconSpace.className = 'project-icon-space';
      iconSpace.setAttribute('aria-hidden', 'true');
      identity.prepend(iconSpace);
      // Hover presentations sit on the permanent dark default background.
      content.style.setProperty('--project-foreground', '#fff');
      content.dataset.figmaNode = project.infoNode;
      content.setAttribute('aria-hidden', 'true');
      content.querySelector('.title-text').textContent = project.title;
      content.querySelector('h1').removeAttribute('data-figma-node');
      content.querySelector('.introduction').textContent = project.shortIntroduction;
      projectHeader.append(content);
      presentationLayers.set(index, content);

      const background = document.createElement('div');
      background.className = 'background-layer';
      background.style.backgroundColor = project.background;
      background.dataset.foreground = ['#000','#000000'].includes(project.foreground) ? 'dark' : 'light';
      const cover = document.createElement('img');
      cover.className = 'background-cover';
      cover.src = project.backgroundImage;
      cover.alt = '';
      cover.width = 256;
      cover.height = 280;
      cover.decoding = 'async';
      trackImageLoad(cover, { lazy: true });
      const tint = document.createElement('div');
      tint.className = 'background-tint';
      tint.style.backgroundColor = project.background;
      background.append(cover, tint);
      pageBackground.append(background);
      backgroundLayers.set(index, background);
    });
    presentationLayers.forEach((layer, index) => {
      gsap.set(layer, { autoAlpha: index === null ? 1 : 0 });
    });
    gsap.set('.identity-face, .title-text, .header-content .introduction, .project-symbol-stage', {
      transformPerspective: 900,
      transformOrigin: '50% 50% -24px',
    });
    gsap.set(symbolStage, { autoAlpha: 0, rotationX: 90 });
  }

  function applyPresentation(index) {
    if (index === presentationIndex) return;
    const previousIndex = presentationIndex;
    const previous = presentationLayers.get(presentationIndex);
    const next = presentationLayers.get(index);
    const project = index === null ? DEFAULT_PROJECT : PROJECTS[index];
    const groupFlip = previousIndex === null || index === null;
    const previousText = groupFlip
      ? [previous.querySelector('.identity-face'), previous.querySelector('.introduction')]
      : previous.querySelectorAll('.title-text, .introduction');
    const nextText = groupFlip
      ? [next.querySelector('.identity-face'), next.querySelector('.introduction')]
      : next.querySelectorAll('.title-text, .introduction');
    presentationTween?.kill();
    presentationTween = null;
    // Clear abandoned layers when another card interrupts a flip.
    presentationLayers.forEach(layer => {
      if (layer !== previous) {
        gsap.set(layer, { autoAlpha: 0 });
        gsap.set(layer.querySelector('.identity-face'), { rotationX: 0, opacity: 1 });
        gsap.set(layer.querySelector('.title-text'), { rotationX: 0, opacity: 1 });
      }
    });
    if (groupFlip) {
      gsap.set(previous.querySelector('.title-text'), { rotationX: 0, opacity: 1 });
    } else {
      // A fast card switch can interrupt the initial group flip.
      gsap.set(previous.querySelector('.identity-face'), { rotationX: 0, opacity: 1 });
    }
    previous.classList.remove('is-active');
    previous.setAttribute('aria-hidden', 'true');
    next.classList.add('is-active');
    next.removeAttribute('aria-hidden');
    presentationIndex = index;
    if (reducedMotion.matches) {
      gsap.set(previous, { autoAlpha: 0 });
      gsap.set(next, { autoAlpha: 1 });
      gsap.set(nextText, { rotationX: 0, opacity: 1 });
      logoPath.setAttribute('d', project.logo);
      gsap.set(symbolStage, { autoAlpha: index === null ? 0 : 1, rotationX: 0 });
      gsap.set(logoSVG, { color: '#fff' });
      return;
    }
    presentationTween = gsap.timeline()
      .to(previousText, {
        rotationX: -90, opacity: 0, duration: 0.24,
        stagger: 0.035, ease: 'power2.in',
      }, 0)
      .set(previous, { autoAlpha: 0 }, 0.28)
      .set(next, { autoAlpha: 1 }, 0.14)
      .fromTo(nextText, { rotationX: 90, opacity: 0 }, {
        rotationX: 0, opacity: 1, duration: 0.38,
        stagger: 0.045, ease: 'power3.out',
      }, 0.14);
    if (groupFlip && index !== null) {
      logoPath.setAttribute('d', project.logo);
      gsap.set(symbolStage, { autoAlpha: 0 });
      presentationTween.fromTo(symbolStage, { rotationX: 90, autoAlpha: 0 }, {
        rotationX: 0, autoAlpha: 1, duration: 0.38, ease: 'power3.out',
      }, 0.14);
    } else if (groupFlip) {
      presentationTween.to(symbolStage, {
        rotationX: -90, autoAlpha: 0, duration: 0.24, ease: 'power2.in',
      }, 0).call(() => logoPath.setAttribute('d', project.logo), null, 0.28);
    } else {
      gsap.set(symbolStage, { autoAlpha: 1, rotationX: 0 });
      presentationTween.to(logoPath, {
        morphSVG: { shape: project.logo, map: 'position' },
        duration: 0.6, ease: 'power2.inOut',
      }, 0);
    }
    presentationTween.to(logoSVG, { color: '#fff', duration: 0.3 }, 0);
  }

  function requestPresentation(index) {
    pendingPresentationIndex = index;
    presentationPending = true;
    requestRender();
  }

  function setPresentation(item) {
    clearTimeout(backgroundResetTimer);
    backgroundResetTimer = null;
    if (item) {
      requestPresentation(item.projectIndex);
      return;
    }
    // Keep the current color while the pointer crosses a gap between cards.
    backgroundResetTimer = setTimeout(() => {
      backgroundResetTimer = null;
      if (mode === 'idle' && !hoverActive) requestPresentation(null);
    }, BACKGROUND_RESET_DELAY);
  }

  function setHovered(item) {
    if (mode !== 'idle') return;
    hoverActive = Boolean(item);
    if (item) hovered = item;
    setPresentation(item);
    requestRender();
  }

  // Card markup and event bindings.
  function register(slot) {
    const button = slot.querySelector('button');
    const item = {
      slot,
      button,
      index: items.length,
      projectIndex: Number(button.dataset.projectIndex),
      offset: Number(slot.style.getPropertyValue('--offset')),
      angle: 0,
      hoverAmount: 0,
      anglePush: 0,
      renderState: {},
    };
    button.setAttribute('aria-label', PROJECTS[item.projectIndex].title);
    button.innerHTML = cardMarkup(item.projectIndex);
    trackImageLoad(button.querySelector('.card-image'));
    items.push(item);
    button.addEventListener('pointerenter', event => {
      if (event.pointerType === 'mouse') setHovered(item);
    });
    button.addEventListener('pointerleave', event => {
      if (event.pointerType === 'mouse' && hovered === item) setHovered(null);
    });
    button.addEventListener('focus', () => {
      if (button.matches(':focus-visible')) setHovered(item);
    });
    button.addEventListener('blur', () => {
      if (hovered === item) setHovered(null);
    });
    button.addEventListener('click', () => openProject(item));
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[character]);
  }

  function cardMarkup(index) {
    const project = PROJECTS[index];
    return `<span class="card-art" data-figma-node="${project.cardNode}" aria-hidden="true">
      <img class="card-image" src="${project.thumbnail}" srcset="${project.thumbnail} 344w, ${project.thumbnail2x} 688w" sizes="(max-width: 767px) clamp(149px, 37.267vw, 199px), clamp(206px, 18.633vw, 344px)" width="344" height="376" alt="" draggable="false" decoding="async" data-figma-node="${project.imageNode}">
      <span class="card-number">${String(index + 1).padStart(2, '0')}</span>
      <span class="card-category"><span>${escapeHTML(project.category)}</span><span>${escapeHTML(project.brand)}</span></span>
      <span class="card-subtitle">${escapeHTML(project.subtitle)}</span>
      <span class="card-title">${project.cardTitle.map(line => `<span>${escapeHTML(line)}</span>`).join('')}</span>
    </span>`;
  }

  // A new token invalidates decode callbacks from a closed/reopened project.
  function prepareModalContent(index) {
    const loadVersion = ++modalLoadVersion;
    const project = PROJECTS[index];
    if (modalDetailObserver) modalDetailObserver.disconnect();
    modalShowcaseReady = Boolean(project.details.length);
    modalShowcase.hidden = !project.details.length;
    const loadDetailImage = img => {
      if (!img.dataset.src || img.src) return;
      img.src = img.dataset.src;
      delete img.dataset.src;
      trackImageLoad(img, { lazy: true });
    };
    const detailImages = project.details.map((detail, detailIndex) => {
      const img = document.createElement('img');
      img.className = 'modal-showcase-image image-skeleton';
      img.dataset.src = detail.src;
      img.width = detail.width; img.height = detail.height;
      img.alt = detail.alt || project.title + ' 项目展示'; img.decoding = 'async';
      img.loading = 'lazy';
      img.fetchPriority = detailIndex === 0 ? 'high' : 'low';
      img.addEventListener('error', () => { img.hidden = true; }, { once: true });
      return img;
    });
    modalShowcase.replaceChildren(...detailImages);
    if (detailImages.length) {
      loadDetailImage(detailImages[0]);
      modalDetailObserver = new IntersectionObserver(entries => {
        if (loadVersion !== modalLoadVersion) return;
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          loadDetailImage(entry.target);
          modalDetailObserver.unobserve(entry.target);
        });
      }, { root: modalProject, rootMargin: '120% 0px', threshold: 0.01 });
      detailImages.slice(1).forEach(img => modalDetailObserver.observe(img));
    }
    // Show a cached card cover while the selected high-resolution image decodes.
    modalImage.dataset.projectIndex = String(index);
    modalImage.src = project.thumbnail2x;
    trackImageLoad(modalImage);
    setTimeout(() => {
      if (!dialog.open || loadVersion !== modalLoadVersion) return;
      const fullCover = new Image();
      fullCover.decoding = 'async'; fullCover.fetchPriority = 'low';
      fullCover.src = project.image;
      fullCover.decode().then(() => {
        if (dialog.open && loadVersion === modalLoadVersion) modalImage.src = project.image;
      }).catch(() => {});
    }, 1500);
    modalImage.alt = project.imageAlt;
    modalNumber.textContent = String(index + 1).padStart(2, '0');
    modalCategory.innerHTML = `<span>${escapeHTML(project.category)}</span><span>${escapeHTML(project.brand)}</span>`;
    modalSubtitle.textContent = project.subtitle;
    modalTitle.innerHTML = project.cardTitle.map(escapeHTML).join('<br>');
    modalIntroduction.textContent = project.introduction;
    modalProject.scrollTop = 0;
    modalScrollStart = 0;
  }

  // Geometry reads happen once per requested frame or before opening a dialog.
  function measure() {
    layoutDirty = false;
    const actualWidth = parseFloat(getComputedStyle(items[0].slot).width);
    const rect = collection.getBoundingClientRect();
    layout = {
      width: actualWidth,
      height: actualWidth * 1.5,
      radius: Math.max(actualWidth * 17.1, innerHeight - rect.top + actualWidth),
      corner: parseFloat(getComputedStyle(items[0].button).borderTopLeftRadius),
      top: rect.top + scrollY,
      centerX: rect.left + collection.clientWidth / 2,
    };
    const innerRadius = layout.radius - layout.height / 2;
    const gap = 2 * innerRadius * Math.sin(STEP * DEG / 2) - layout.width * Math.cos(STEP * DEG / 2);
    const expandedStep = (Math.atan2(layout.width / 2, innerRadius)
      + Math.asin((gap + layout.width * HOVER_SCALE / 2) / Math.hypot(innerRadius, layout.width / 2))) / DEG;
    layout.hoverPush = Math.max(0, expandedStep - STEP);
    collection.style.setProperty('--arc-radius', `${layout.radius}px`);
    stackLayout = null;
    modalNeedsRender = true;

    // Buffer copies preserve a six-project cycle and both neighbors near the wrap point.
    const edgeAngle = Math.asin(Math.min(0.95, (innerWidth / 2 + layout.width * 0.9) / layout.radius)) / DEG;
    const requiredCount = Math.max(2, Math.ceil(2 * (edgeAngle + STEP * 2) / (CARD_COUNT * STEP))) * CARD_COUNT;
    for (let index = items.length; index < requiredCount; index++) {
      const slot = document.createElement('li');
      const projectIndex = index % CARD_COUNT;
      slot.className = 'work-slot';
      slot.style.setProperty('--offset', items[0].offset + index);
      slot.innerHTML = '<button class="work-card" aria-haspopup="dialog"></button>';
      const button = slot.querySelector('button');
      button.dataset.projectIndex = projectIndex;
      collection.append(slot);
      register(slot);
    }
    layout.angleSpan = items.length * STEP;
    layout.baseAngles = new Array(items.length);
    collection.setAttribute('aria-label', `${CARD_COUNT} 个项目循环画廊`);
  }

  function openProject(item) {
    if (mode !== 'idle') return;
    selected = item;
    prepareModalContent(item.projectIndex);
    stackOffsets = createStackOffsets();
    stackLayout = null;
    lastModalAmount = null;
    mode = 'opening';
    direction = 1;
    pointerTarget = pointerAngle;
    setPresentation(item);
    dialog.setAttribute('aria-label', `${PROJECTS[item.projectIndex].title} 作品预览`);
    document.body.classList.add('is-modal-open');
    measure();
    item.button.style.visibility = 'hidden';
    renderModal(0);
    // Native dialog autofocus runs inside showModal(). Keep that focus on
    // the stationary dialog, not the still-offscreen animated close button.
    dialog.showModal();
    requestRender();
  }

  function closeProject() {
    if (mode === 'idle' || mode === 'closing') return;
    modalScrollStart = modalProject.scrollTop;
    mode = 'closing';
    direction = -1;
    requestRender();
  }

  function finishClosing() {
    modalLoadVersion++;
    if (modalDetailObserver) {
      modalDetailObserver.disconnect();
      modalDetailObserver = null;
    }
    modalImage.dataset.projectIndex = '';
    modalImage.removeAttribute('src');
    modalShowcaseImage.dataset.projectIndex = '';
    modalShowcaseImage.removeAttribute('src');
    modalShowcase.hidden = true;
    modalShowcaseReady = false;
    const previous = selected;
    dialog.close();
    document.body.classList.remove('is-modal-open');
    previous.button.style.visibility = '';
    selected = null;
    stackOffsets = [];
    stackLayout = null;
    mode = 'idle';
    direction = 0;
    previous.button.focus({ preventScroll: true });
    const underPointer = pointerX === null ? null : document.elementFromPoint(pointerX, pointerY);
    const hoverAfterClosing = items.find(item => item.button.contains(underPointer));
    hovered = hoverAfterClosing || previous;
    hoverActive = Boolean(hoverAfterClosing);
    if (previous.button.matches(':focus-visible')) hoverActive = true;
    setPresentation(hoverActive ? hovered : null);
    measure();
  }

  function modalMetrics() {
    const width = Math.min(1120, innerWidth < 768 ? innerWidth - 64 : innerWidth * 0.7);
    const top = innerHeight * 0.09;
    const height = innerHeight - top;
    return { width, height, left: (innerWidth - width) / 2, top };
  }

  function renderModal(amount) {
    if (amount === lastModalAmount && !modalNeedsRender) return;
    lastModalAmount = amount;
    modalNeedsRender = false;
    const angle = selected.angle * DEG;
    const centerX = layout.centerX + layout.radius * Math.sin(angle);
    const centerY = layout.top - scrollY + layout.height / 2 + layout.radius * (1 - Math.cos(angle));
    const { width, height, top } = modalMetrics();
    const scale = mix(1, HOVER_SCALE, selected.hoverAmount);
    const scaleX = mix(layout.width * scale / width, 1, amount);
    const scaleY = mix(layout.height * scale / height, 1, amount);
    const topCorner = mix(layout.corner * scale, 20, amount);
    const bottomCorner = mix(layout.corner * scale, 0, amount);
    panel.style.width = `${width}px`;
    panel.style.height = `${height}px`;
    renderModalContent(amount, { width, height, scaleX, scaleY, scale, topCorner });
    modalProject.style.pointerEvents = amount > 0.8 ? 'auto' : 'none';
    panel.style.transform = `translate(${mix(centerX, innerWidth / 2, amount) - width / 2}px, ${mix(centerY, top + height / 2, amount) - height / 2}px) rotate(${selected.angle * (1 - amount)}deg) scale(${scaleX}, ${scaleY})`;
    panel.style.borderRadius = `${topCorner / scaleX}px ${topCorner / scaleX}px ${bottomCorner / scaleX}px ${bottomCorner / scaleX}px / ${topCorner / scaleY}px ${topCorner / scaleY}px ${bottomCorner / scaleY}px ${bottomCorner / scaleY}px`;
    shade.style.opacity = amount;
    closeButton.style.opacity = clamp((amount - 0.65) / 0.35);
    closeButton.style.pointerEvents = amount > 0.8 ? 'auto' : 'none';
    closeButton.tabIndex = amount > 0.8 ? 0 : -1;
  }

  function renderModalContent(amount, { width, height, scaleX, scaleY, scale, topCorner }) {
    const sourceWidth = layout.width * scale;
    const sourceUnit = sourceWidth / 360;
    const liveWidth = width * scaleX;
    const liveHeight = height * scaleY;
    const sourceInset = 8 * sourceUnit;
    const finalInset = 12;
    const inset = mix(sourceInset, finalInset, amount);
    const titleFit = Math.min(1, Math.max(0.5, (width - 40) / 320));
    const finalTitleHeight = 68 * titleFit;
    // Reserve space below the image for subtitle, two title lines and the
    // four-line introduction. On a short viewport, the panel can scroll.
    const footerHeight = 28 + 20 + 8 + finalTitleHeight + 20 + 64 + finalInset;
    // The gallery card is only the transition source. Collapse it completely
    // once the detail panel is open so the detail page starts with its title.
    const finalImageHeight = 0;
    const imageHeight = mix(376 * sourceUnit, finalImageHeight, amount);
    const subtitleTop = mix(412 * sourceUnit, finalInset + 28, amount);
    const titleTop = mix(440 * sourceUnit, finalInset + 56, amount);
    const introTop = titleTop + mix(68 * sourceUnit, finalTitleHeight, amount) + 20;

    // Cancel the panel's changing X/Y scale so image fill and typography
    // are calculated in screen-pixel proportions throughout the motion.
    modalProject.style.width = `${liveWidth}px`;
    modalProject.style.height = `${liveHeight}px`;
    modalProject.style.transform = `scale(${1 / scaleX}, ${1 / scaleY})`;
    modalProject.style.overflowY = amount === 1 || modalScrollStart > 0 ? 'auto' : 'hidden';
    if (mode === 'closing' && modalScrollStart > 0) {
      const scrollAmount = PROJECTS[selected.projectIndex].displayImage ? clamp((amount - 0.7) / 0.3) : amount;
      modalProject.scrollTop = modalScrollStart * scrollAmount;
    }

    // Append the showcase with the same inset as the cover, plus a bottom gutter.
    modalShowcase.style.top = `${introTop + 64 + finalInset}px`;
    modalShowcase.style.left = `${inset}px`;
    modalShowcase.style.width = `${liveWidth - inset * 2}px`;
    modalShowcase.style.paddingBottom = `${inset}px`;
    const showcaseOpacity = modalShowcaseReady ? clamp((amount - 0.6) / 0.4) : 0;
    modalShowcase.style.opacity = showcaseOpacity;
    modalShowcase.setAttribute('aria-hidden', String(showcaseOpacity !== 1));

    const imageWidth = liveWidth - inset * 2;
    modalMedia.style.left = `${inset}px`;
    modalMedia.style.top = `${inset}px`;
    modalMedia.style.width = `${imageWidth}px`;
    modalMedia.style.height = `${imageHeight}px`;
    modalMedia.style.borderRadius = `${Math.max(0, topCorner - inset)}px`;
    modalMedia.style.opacity = 1 - amount;
    // Figma Fill: one uniform scale covers the frame; its overflow is
    // cropped equally on both sides, preserving the photo's proportions.
    const fillScale = Math.max(imageWidth / 344, imageHeight / 376);
    modalImage.style.left = `${(imageWidth - 344 * fillScale) / 2}px`;
    modalImage.style.top = `${(imageHeight - 376 * fillScale) / 2}px`;
    modalImage.style.transform = `scale(${fillScale})`;

    const fieldUnit = mix(sourceUnit, titleFit, amount);
    const labelInset = mix(24 * sourceUnit, finalInset + 20 * titleFit, amount);
    modalNumber.style.left = `${labelInset}px`;
    modalNumber.style.top = `${labelInset}px`;
    modalNumber.style.fontSize = `${24 * fieldUnit}px`;
    modalNumber.style.lineHeight = `${28 * fieldUnit}px`;
    modalCategory.style.right = `${labelInset}px`;
    modalCategory.style.top = `${labelInset}px`;
    modalCategory.style.fontSize = `${12 * fieldUnit}px`;
    modalCategory.style.lineHeight = `${14 * fieldUnit}px`;
    modalNumber.style.opacity = 1 - amount;
    modalCategory.style.opacity = 1 - amount;

    const textInset = mix(20 * sourceUnit, 20, amount);
    for (const element of [modalSubtitle, modalTitle]) {
      element.style.left = `${textInset}px`;
      element.style.width = `${liveWidth - textInset * 2}px`;
    }
    modalSubtitle.style.top = `${subtitleTop}px`;
    modalSubtitle.style.fontSize = `${mix(14 * sourceUnit, 14, amount)}px`;
    modalSubtitle.style.lineHeight = `${mix(20 * sourceUnit, 20, amount)}px`;
    modalSubtitle.style.letterSpacing = `${mix(-0.14 * sourceUnit, -0.14, amount)}px`;
    modalTitle.style.top = `${titleTop}px`;
    modalTitle.style.fontSize = `${26 * fieldUnit}px`;
    modalTitle.style.lineHeight = `${34 * fieldUnit}px`;
    modalTitle.style.letterSpacing = `${-0.26 * fieldUnit}px`;

    const introWidth = Math.min(240, liveWidth - 40);
    modalIntroduction.style.width = `${introWidth}px`;
    modalIntroduction.style.left = `${(liveWidth - introWidth) / 2}px`;
    modalIntroduction.style.top = `${introTop}px`;
    modalIntroduction.style.opacity = clamp((amount - 0.4) / 0.6);
  }

  function createStackOffsets() {
    let offset = Math.round(mix(-SIDE_STACK_JITTER, SIDE_STACK_JITTER, Math.random()));
    return Array.from({ length: 4 }, (_, index) => {
      if (index > 0) {
        const lower = Math.max(-SIDE_STACK_JITTER, offset - SIDE_STACK_MAX_STEP);
        const upper = Math.min(SIDE_STACK_JITTER, offset + SIDE_STACK_MAX_STEP);
        offset = Math.round(mix(lower, upper, Math.random()));
      }
      return offset;
    });
  }

  function sideTargets() {
    if (mode === 'idle') return EMPTY_TARGETS;
    if (stackLayout) return stackLayout;
    const targets = new Map();
    const modal = modalMetrics();
    const scale = Math.min(1.5, Math.max(0.9, modal.height * 0.58 / layout.height));
    const width = layout.width * scale;
    const height = layout.height * scale;
    const nearInset = Math.max(
      Math.min(modal.left * SIDE_STACK_NEAR_INSET_RATIO, width * 0.16),
      width / (2 * Math.cos(16 * DEG)) - modal.left * 0.65,
    );
    const inset = Math.max(12, layout.corner * scale + 4);
    const halfWidth = width / 2 - inset;
    const halfHeight = height / 2 - inset;

    // Preserve the actual left/right order of every rendered card, including
    // buffer copies. Every card receives a target in the same side fan.
    for (const side of [-1, 1]) {
      const ordered = items.filter(item => item !== selected && Math.sign(item.angle - selected.angle) === side)
        .sort((a, b) => Math.abs(a.angle - selected.angle) - Math.abs(b.angle - selected.angle));
      const edge = side < 0 ? modal.left : modal.left + modal.width;
      const nearX = edge - side * nearInset;
      const nearY = innerHeight + height * 0.02;
      let farX = nearX + side * width * 0.56;
      let farY = nearY + height * 0.18;
      const farOffset = stackOffsets[side < 0 ? 0 : 3];
      farX -= Math.sin(side * 30 * DEG) * farOffset;
      farY += Math.cos(30 * DEG) * farOffset;

      // Keep the rear card over the bottom corner, while its upper portion
      // remains visible behind the front card.
      const cos = Math.cos(30 * DEG);
      const sin = Math.sin(30 * DEG);
      const inwardX = side < 0 ? farX : innerWidth - farX;
      const bottomY = innerHeight - farY;
      const cornerX = -cos * inwardX - sin * bottomY;
      const cornerY = -sin * inwardX + cos * bottomY;
      const outward = Math.min(
        Math.max(0, (-halfWidth - cornerX) / cos),
        inwardX + cos * halfWidth + sin * halfHeight,
      );
      farX += side * outward;
      farY += Math.max(0, (cornerY + sin * outward - halfHeight) / cos);

      ordered.forEach((item, index) => {
        const distance = index + 1;
        const angle = side * Math.min(75, 16 + index * 14);
        let x = nearX + (farX - nearX) * index;
        let y = nearY + (farY - nearY) * index;
        if (index === 0) {
          const offset = stackOffsets[side < 0 ? 1 : 2];
          x -= side * (width * 0.08 + 20);
          x -= Math.sin(angle * DEG) * offset;
          y -= height * 0.06 + 32;
          y += Math.cos(angle * DEG) * offset;
        }
        targets.set(item, {
          x, y, angle, scale,
          brightness: Math.max(0.45, 0.78 - index * 0.13),
          zIndex: Math.max(1, 30 - distance),
          side, distance,
        });
      });
    }
    stackLayout = targets;
    return targets;
  }

  // Render only while motion or invalidated content needs another frame.
  function frame(now) {
    frameRequest = null;
    if (layoutDirty) measure();
    const elapsed = Math.max(0, (now - lastTime) / 1000);
    const dt = Math.min(elapsed, 0.05);
    lastTime = now;
    // Coalesce pointer events into one presentation switch per display frame.
    if (presentationPending) {
      presentationPending = false;
      applyPresentation(pendingPresentationIndex);
    }
    const pointerSmoothing = reducedMotion.matches ? 1 : 1 - Math.exp(-14 * elapsed);
    // Each card keeps its own state; interrupted hover transitions continue from the current pose.
    const hoverSmoothing = reducedMotion.matches ? 1 : 1 - Math.exp(-Math.log(20) * elapsed / HOVER_ANIMATION_SECONDS);
    if (mode === 'idle') {
      if (!hoverActive) {
        if (!reducedMotion.matches) phase -= AUTO_SPEED * dt;
      }
      pointerAngle = approach(pointerAngle, pointerTarget, pointerSmoothing);
    } else if (direction !== 0) {
      progress = reducedMotion.matches ? (direction > 0 ? 1 : 0) : clamp(progress + direction * elapsed / EXPAND_SECONDS);
    }

    const angles = layout.baseAngles;
    for (let index = 0; index < items.length; index++) {
      angles[index] = wrap(items[index].offset * STEP + phase + pointerAngle, layout.angleSpan);
    }
    const hoveredAngle = hoverActive && hovered ? angles[hovered.index] : 0;
    const amount = ease(progress);

    items.forEach((item, index) => {
      if (mode === 'idle') {
        const targetAmount = hoverActive && item === hovered ? 1 : 0;
        const targetPush = hoverActive && item !== hovered ? Math.sign(angles[index] - hoveredAngle) * layout.hoverPush : 0;
        item.hoverAmount = approach(item.hoverAmount, targetAmount, hoverSmoothing);
        item.anglePush = approach(item.anglePush, targetPush, hoverSmoothing);
      }
      item.angle = angles[index] + item.anglePush;
    });
    if (mode === 'idle' && !hoverActive && items.every(item => item.hoverAmount < 0.0001)) hovered = null;
    const targets = sideTargets();
    const headerOpacity = String(1 - amount);
    if (projectHeader.style.opacity !== headerOpacity) projectHeader.style.opacity = headerOpacity;

    items.forEach(item => {
      const angle = item.angle * DEG;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const sourceScale = mix(1, HOVER_SCALE, item.hoverAmount);
      const target = targets.get(item);
      const itemScale = target ? mix(sourceScale, target.scale, amount) : sourceScale;
      const centerX = layout.centerX + layout.radius * sin;
      const centerY = layout.top - scrollY + layout.height / 2 + layout.radius * (1 - cos);
      let translateX = 0;
      let translateY = 0;
      let rotation = 0;
      if (target) {
        const dx = (target.x - centerX) * amount;
        const dy = (target.y - centerY) * amount;
        rotation = (target.angle - item.angle) * amount;
        // Convert the screen-space movement into the rotated slot's local coordinates.
        translateX = dx * cos + dy * sin;
        translateY = -dx * sin + dy * cos;
      }
      const state = item.renderState;
      const slotAngle = Math.round(item.angle * 10000) / 10000;
      const x = Math.round(translateX * 1000) / 1000;
      const y = Math.round(translateY * 1000) / 1000;
      const cardAngle = Math.round(rotation * 10000) / 10000;
      const scale = Math.round(itemScale * 10000) / 10000;
      const brightness = amount > 0 && target ? Math.round(mix(1, target.brightness, amount) * 1000) / 1000 : null;
      const zIndex = target ? target.zIndex : item.hoverAmount > 0.001 ? 2 : '';
      const tabIndex = Math.abs(centerX - innerWidth / 2) < innerWidth / 2 + layout.width / 2 ? 0 : -1;
      if (state.slotAngle !== slotAngle) {
        state.slotAngle = slotAngle;
        item.slot.style.transform = `translateX(-50%) rotate(${slotAngle.toFixed(4)}deg)`;
      }
      if (state.x !== x || state.y !== y || state.cardAngle !== cardAngle || state.scale !== scale) {
        state.x = x;
        state.y = y;
        state.cardAngle = cardAngle;
        state.scale = scale;
        item.button.style.transform = `translate(${x.toFixed(3)}px, ${y.toFixed(3)}px) rotate(${cardAngle.toFixed(4)}deg) scale(${scale.toFixed(4)})`;
      }
      if (state.brightness !== brightness) {
        state.brightness = brightness;
        item.button.style.filter = brightness === null ? '' : `brightness(${brightness.toFixed(3)})`;
      }
      if (state.zIndex !== zIndex) {
        state.zIndex = zIndex;
        item.slot.style.zIndex = zIndex;
      }
      if (state.tabIndex !== tabIndex) {
        state.tabIndex = tabIndex;
        item.button.tabIndex = tabIndex;
      }
    });

    if (mode !== 'idle') {
      renderModal(amount);
      if (progress === 1 && direction > 0) {
        mode = 'open';
        direction = 0;
        if (document.activeElement === dialog) {
          closeButton.focus({ preventScroll: true });
        }
      } else if (progress === 0 && direction < 0) {
        finishClosing();
      }
    }
    if (needsNextFrame() && frameRequest === null && !document.hidden) {
      frameRequest = requestAnimationFrame(frame);
    }
  }

  // Browser lifecycle and input wake the renderer on demand.
  document.addEventListener('pointermove', event => {
    const previousX = pointerX;
    pointerX = event.clientX;
    pointerY = event.clientY;
    if (event.pointerType === 'mouse' && previousX !== null && mode === 'idle') {
      pointerTarget -= (pointerX - previousX) / innerWidth * MOUSE_SWEEP;
      requestRender();
    }
  });
  function moveGallery(direction) {
    if (mode !== 'idle') return;
    setHovered(null);
    pointerTarget += direction * STEP;
    requestRender();
  }
  previousButton.addEventListener('click', () => moveGallery(1));
  nextButton.addEventListener('click', () => moveGallery(-1));
  document.documentElement.addEventListener('pointerleave', () => {
    pointerX = null;
    if (mode === 'idle') setHovered(null);
  });
  closeButton.addEventListener('click', closeProject);
  shade.addEventListener('click', closeProject);
  dialog.addEventListener('cancel', event => {
    event.preventDefault();
    closeProject();
  });
  window.addEventListener('resize', invalidateLayout);
  window.addEventListener('scroll', invalidateLayout, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(frameRequest);
      frameRequest = null;
    } else {
      invalidateLayout();
    }
  });
  reducedMotion.addEventListener('change', event => {
    if (event.matches) presentationTween?.progress(1);
    requestRender();
  });
  // Initialize after the markup and vendor scripts are available.
  collection.querySelectorAll('.work-slot').forEach(register);
  trackImageLoad(document.querySelector('.default-background-media img'));
  trackImageLoad(document.querySelector('.avatar'));
  buildPresentationLayers();
  bindAvatarBlur(headerContent.querySelector('.avatar-portrait'));
  const headerObserver = new ResizeObserver(invalidateLayout);
  headerObserver.observe(projectHeader);
  measure();
  requestRender();
})();
